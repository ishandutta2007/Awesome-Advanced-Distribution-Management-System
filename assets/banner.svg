<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07152b"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>

    <!-- Glowing Lines Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="greenCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dynamic Animations -->
    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 4px; opacity: 0.7; }
        50% { r: 7px; opacity: 1; }
      }
      .grid-pattern { animation: pulseGrid 4s ease-in-out infinite; }
      .animated-line {
        stroke-dasharray: 200, 200;
        animation: flowLine 6s linear infinite;
      }
      .grid-node { animation: nodeGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>

  <!-- Grid Pattern Overlay -->
  <g class="grid-pattern" stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />

    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="850" y1="0" x2="850" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Dynamic Electric Grid Network Background Lines -->
  <g filter="url(#glow)">
    <!-- Circuit lines -->
    <path d="M 50 260 L 250 260 L 350 200 L 700 200 L 850 260 L 1150 260" fill="none" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.4" />
    <path d="M 100 60 L 300 60 L 450 120 L 750 120 L 900 60 L 1100 60" fill="none" stroke="url(#greenCyan)" stroke-width="2" opacity="0.4" />
    
    <!-- Dynamic animated pulses -->
    <path class="animated-line" d="M 50 260 L 250 260 L 350 200 L 700 200 L 850 260 L 1150 260" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <path class="animated-line" d="M 100 60 L 300 60 L 450 120 L 750 120 L 900 60 L 1100 60" fill="none" stroke="#34d399" stroke-width="3" opacity="0.8" />
  </g>

  <!-- Substation Nodes (Background layer, non-obstructive) -->
  <g fill="#38bdf8">
    <circle class="grid-node" cx="250" cy="260" r="5" />
    <circle class="grid-node" cx="350" cy="200" r="5" style="animation-delay: 1s;" />
    <circle class="grid-node" cx="700" cy="200" r="5" style="animation-delay: 1.5s;" />
    <circle class="grid-node" cx="850" cy="260" r="5" style="animation-delay: 0.5s;" />
    <circle class="grid-node" cx="300" cy="60" r="5" style="animation-delay: 0.8s;" />
    <circle class="grid-node" cx="450" cy="120" r="5" style="animation-delay: 1.2s;" />
    <circle class="grid-node" cx="750" cy="120" r="5" style="animation-delay: 0.3s;" />
    <circle class="grid-node" cx="900" cy="60" r="5" style="animation-delay: 1.7s;" />
  </g>

  <!-- Title & Subtitle Foreground (High Contrast & Clear Readability) -->
  <g text-anchor="middle">
    <!-- Icon / Symbol -->
    <g transform="translate(600, 75)">
      <circle cx="0" cy="0" r="28" fill="#0369a1" opacity="0.6" filter="url(#glow)"/>
      <path d="M -8 -12 L 4 -2 L -2 4 L 8 14 L -4 4 L 2 -2 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">
      Awesome Advanced Distribution Management System
    </text>

    <!-- Tagline / Subtitle -->
    <text x="600" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      ⚡ Enterprise ADMS, Smart Grid SCADA, OMS, DERMS &amp; Open-Source Power System Libraries ⚡
    </text>

    <!-- Badges Row in SVG -->
    <g transform="translate(600, 235)">
      <!-- Badge 1: Commercial Platforms -->
      <rect x="-220" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="-155" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🏢 Enterprise SaaS</text>

      <!-- Badge 2: Open Source -->
      <rect x="-75" y="0" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">💻 Open Source Tools</text>

      <!-- Badge 3: Grid Modernization -->
      <rect x="90" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="155" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#a78bfa">🌐 Smart Grid &amp; CIM</text>
    </g>
  </g>
</svg>

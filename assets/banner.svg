<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#07152b"/><stop offset="100%" stop-color="#020813"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="greenCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGrid{0%{opacity:.15}50%{opacity:.35}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes nodeGlow{0%{r:4px;opacity:.7}50%{r:7px;opacity:1}}.grid-pattern{animation:pulseGrid 4s ease-in-out infinite}.animated-line{stroke-dasharray:200,200;animation:flowLine 6s linear infinite}.grid-node{animation:nodeGlow 3s ease-in-out infinite}</style></defs><rect width="1200" height="320" fill="url(#bgGradient)"/><g stroke="#1e293b" stroke-width="1" class="grid-pattern"><line x1="0" x2="1200" y1="40" y2="40"/><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="200" y2="200"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="100" x2="100" y1="0" y2="320"/><line x1="250" x2="250" y1="0" y2="320"/><line x1="400" x2="400" y1="0" y2="320"/><line x1="550" x2="550" y1="0" y2="320"/><line x1="700" x2="700" y1="0" y2="320"/><line x1="850" x2="850" y1="0" y2="320"/><line x1="1000" x2="1000" y1="0" y2="320"/></g><g filter="url(#glow)"><path fill="none" stroke="url(#cyanPurple)" stroke-width="2" d="M 50 260 L 250 260 L 350 200 L